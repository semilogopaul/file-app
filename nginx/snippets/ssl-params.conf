# =============================================================================
# TLS hardening - Mozilla "Intermediate" profile (https://ssl-config.mozilla.org/),
# chosen for broad browser compatibility while still dropping legacy/weak
# protocols and ciphers. Re-check periodically as guidance evolves.
# =============================================================================

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# TLS 1.3 always lets the client pick the cipher (this directive is a no-op
# there); for TLS 1.2, "off" matches current Mozilla guidance - modern
# client-preferred ordering is no less secure and simplifies operations.
ssl_prefer_server_ciphers off;

# Session resumption - avoids a full handshake on repeat visits.
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling - the server fetches the certificate's revocation status
# once and serves it with the handshake, saving the client a round trip.
# No-ops harmlessly against certs without an OCSP responder (e.g. the
# self-signed dev cert from certs/generate-self-signed.sh).
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.11 valid=30s;   # Docker's embedded DNS resolver - needed for the OCSP lookup above
resolver_timeout 5s;
