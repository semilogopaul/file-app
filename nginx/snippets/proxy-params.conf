# =============================================================================
# Shared reverse-proxy headers - included by every proxied location so the
# upstream app (Next.js/NestJS) sees the real client info instead of nginx's.
# =============================================================================

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket upgrade passthrough (see the `$connection_upgrade` map in
# nginx.conf) - transparent no-op for plain HTTP requests.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_http_version 1.1;
proxy_buffering on;
proxy_connect_timeout 5s;

# Send/read timeouts are deliberately NOT set here. They belong to the
# individual location: an app request that takes 30s is a hung backend,
# while a 10MB upload to storage legitimately can. nginx rejects a directive
# repeated in one context, so a value here could not be overridden alongside
# this include.
