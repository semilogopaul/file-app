# =============================================================================
# Shared reverse-proxy headers - included by every proxied location so the
# upstream app (Next.js/NestJS) sees the real client info instead of nginx's.
# =============================================================================

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket upgrade passthrough (see the `$connection_upgrade` map in
# nginx.conf) - transparent no-op for plain HTTP requests.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_http_version 1.1;
proxy_buffering on;
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
