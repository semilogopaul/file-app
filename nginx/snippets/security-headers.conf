# =============================================================================
# Security headers - applied to every response from the HTTPS server block.
# Reference: OWASP Secure Headers Project.
#
# `always` makes nginx send each header on error responses too (4xx/5xx),
# not just 2xx/3xx - without it, a blocked/erroring request would ship
# without these protections.
# =============================================================================

# Force HTTPS for the next 2 years, including subdomains. `preload` opts the
# domain into browser preload lists - only enable once you're certain every
# subdomain genuinely supports HTTPS (submit at hstspreload.org).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Belt-and-suspenders clickjacking defense for browsers that don't honor the
# CSP frame-ancestors directive below.
add_header X-Frame-Options "SAMEORIGIN" always;

# Stop browsers from MIME-sniffing a response away from its declared
# Content-Type - blocks a class of stored-XSS-via-upload attacks.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin (not the full URL/path) on cross-origin requests, and
# nothing at all when downgrading from HTTPS to HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Legacy XSS-filter header - explicitly disabled per current OWASP/MDN
# guidance. The browser XSS auditors it controlled are deprecated/removed in
# modern engines, and the header itself was usable as an XSS vector in older
# IE/Edge. Content-Security-Policy below is the real defense now.
add_header X-XSS-Protection "0" always;

# Deny Flash/Acrobat cross-domain policy files - closes an old plugin-era
# cross-domain data leak vector.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Lock down powerful browser features this app doesn't use, and opt out of
# FLoC/Topics-style ad-tech browser APIs.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Isolate this origin's browsing context/window references and resources
# from other origins (mitigates cross-origin attacks like Spectre-style
# side channels and window.opener abuse).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy - default-deny, then allow-list only what this app
# needs.
#
# 'unsafe-inline' on script-src/style-src is a deliberate, documented
# tradeoff: Next.js injects inline bootstrap/hydration scripts and this
# proxy serves both the frontend and API from one origin, so a static CSP
# here (rather than per-request nonces) is what keeps this config simple
# and framework-agnostic. For a stricter policy, generate a per-request
# nonce in the Next.js app itself (proxy.ts - the file Next 16 renamed
# `middleware.ts` to) and drop 'unsafe-inline' in favor of it; see
# https://nextjs.org/docs/app/guides/content-security-policy. If you do,
# move CSP ownership there instead of here to avoid two conflicting headers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
