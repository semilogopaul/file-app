# =============================================================================
# Main NGINX configuration.
#
# Only global, server-agnostic directives live here; virtual hosts live in
# conf.d/, and reusable directive groups live in snippets/. This image runs
# as the unprivileged `nginx` user (see Dockerfile), so paths that normally
# default to root-owned locations (pid file) are redirected to /tmp, which
# is writable and tmpfs-mounted at runtime (see docker-compose.yml).
# =============================================================================

pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # Logging - plain text to stdout/stderr, as Docker expects. `rt` (request
    # time) is the cheapest possible latency signal without a metrics stack.
    # ---------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---------------------------------------------------------------------
    # Hardening / performance baseline
    # ---------------------------------------------------------------------
    server_tokens off;             # don't advertise the nginx version to clients
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;      # generous default for file uploads; tune per route if needed
    client_body_buffer_size 128k;

    # Slow-client (Slowloris-style) resource exhaustion guards.
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ---------------------------------------------------------------------
    # Compression - reduces bandwidth for text-based responses. Next.js's
    # own hashed static assets are already immutable/cacheable, so this
    # mostly benefits HTML/JSON API responses.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Rate limiting - keyed per client IP. `api` is stricter than `general`
    # since it fronts state-changing/authenticated endpoints. Applied per
    # location in conf.d/default.conf; a shared budget here just declares
    # the zones. 429 (not the nginx default 503) is the correct status for
    # "you're being throttled".
    # ---------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # WebSocket upgrade support for the proxied locations (see
    # snippets/proxy-params.conf) - falls back to a plain "close" when the
    # client isn't asking for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
