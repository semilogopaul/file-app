# =============================================================================
# Upstreams - Docker Compose service names, resolved via the embedded Docker
# DNS. `keepalive` maintains a small pool of warm connections to each
# upstream instead of opening a new one per request.
# =============================================================================

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

upstream storage_upstream {
    server minio:9000;
    keepalive 16;
}

# =============================================================================
# HTTP server - redirects everything to HTTPS. The one exception is
# /healthz, which must stay plain HTTP and un-redirected so Docker's
# HEALTHCHECK (and any HTTP-only load balancer probe) can reach it without
# needing to trust the (possibly self-signed) TLS certificate.
# =============================================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reserved for Let's Encrypt/certbot's HTTP-01 challenge if you add a
    # certbot service later - kept out of the HTTPS redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS server - the only public entry point into the system. Terminates
# TLS, applies security headers/rate limits, and reverse-proxies to the
# frontend/backend app containers, which are otherwise unreachable from
# outside the Docker network (see docker-compose.yml networks).
# =============================================================================
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 20;

    # -------------------------------------------------------------------
    # Backend API, under /api/. The trailing slash on proxy_pass strips
    # the /api prefix before forwarding, so NestJS keeps owning its own
    # internal versioning scheme (/v1/...) independent of how the proxy
    # exposes it publicly - e.g. /api/v1/transactions -> backend
    # /v1/transactions, /api/health -> backend /health.
    # -------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_upstream/;
        include /etc/nginx/snippets/proxy-params.conf;

        # An API call taking longer than this is a hung upstream, not a slow
        # one - fail fast rather than holding the connection open.
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------
    # Object storage, proxied at the bucket path so presigned uploads and
    # downloads are same-origin.
    #
    # This is not a convenience. The browser PUTs directly to storage, and
    # pointing it at http://minio:9000 broke twice over: the page is HTTPS so
    # the request is mixed content, and our own CSP `connect-src 'self'`
    # blocks a cross-origin XHR outright. Serving storage from this origin
    # satisfies both without weakening the policy.
    #
    # The path is NOT rewritten, and Host is passed through unchanged,
    # because SigV4 signs both - altering either invalidates the signature
    # and storage answers 403.
    #
    # `/file-app/` is the bucket name (STORAGE_BUCKET). Change both together.
    location /file-app/ {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://storage_upstream;
        include /etc/nginx/snippets/proxy-params.conf;

        # Uploads stream straight through rather than being spooled to disk
        # first, so a 10MB PUT does not sit in nginx before reaching storage.
        proxy_request_buffering off;
        # Storage may be slow on a large object; the default 30s read timeout
        # would cut a legitimate transfer short.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -------------------------------------------------------------------
    # Everything else - the Next.js frontend. Next's own standalone server
    # already sets long-lived, immutable cache headers on its hashed
    # /_next/static/* assets, so no extra caching logic is needed here.
    # -------------------------------------------------------------------
    location / {
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://frontend_upstream;
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
